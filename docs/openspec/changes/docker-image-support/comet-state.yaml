        outcome:
          actionId: docker-image-support:5
          attempt: 1
          claimToken: portable-7419397822441eda2cdbf227b1d70fd14582948ff34af6663e1d4495f37bb1e8
          inputHash: 28fe3ed5aef1659dee0a840d04d63e23cc00e90c689ffe8d507c0eddc664e21b
          outcomeId: 3f03e343-df0b-438e-a352-8bf96d2c354b
          output:
            handoffContext: docs/openspec/changes/docker-image-support/.comet/handoff/design-context.json
            handoffHash: bd71ff59ecff9a79096bf69e6ed32362d97ac1af9e235a350afb0c01a3c9fc19
            proposal: >-
              技术方案：

              1) 根目录多阶段 Dockerfile：golang:1.26-bookworm 构建阶段按 TARGETARCH 交叉编译
              combined_refactor（CGO 关闭、trimpath、-X main.appVersion
              注入）；alpine:3.22 运行阶段安装 CA/时区，UID/GID 10001 非 root。

              2) 数据持久化：entrypoint 将 /app/cfdata 同步到 /data/cfdata 后
              exec，使配置、.bak、缓存、ASN 库与日志统一落在 /data 卷；WORKDIR=/data。

              3) 健康检查：HTTP GET /favicon.png（未认证），端口由 CFDATA_HEALTHCHECK_PORT
              覆盖，默认 13335。

              4) 独立 .github/workflows/docker.yml：push v* tag 与
              workflow_dispatch；GITHUB_TOKEN 登录 GHCR；镜像
              ghcr.io/tunecc/cfdata-web；tag 推送生成版本 tag、sha-短哈希，稳定 tag 更新
              latest；手动构建生成 latest、edge、sha-短哈希；QEMU + buildx 构建 amd64/arm64，GHA
              缓存，按 ref 并发控制，输出摘要。

              5) 新增 docker-compose.yml、docs/docker.md、README Docker 小节；AGENTS.md
              仅增加 .github/workflows/docker.yml 例外。

              关键取舍：Alpine 兼顾体积与健康检查工具；entrypoint 复制而非软链接，避免 /app 下
              .bak/迁移备份写入失败；手动构建按已确认策略覆盖 latest；构建阶段不联网下载 CA，使用仓库内证书保证可复现。

              主要风险：GHCR 包首次发布需手动设为 public；bind mount 需 chown 10001；手动构建可能把任意分支推为
              latest（文档警示）；多架构 Actions 分钟数增加。

              测试策略：本地 docker build/run 验证非 root、端口、健康、认证、卷持久化、版本与多架构清单；YAML 解析与
              sh -n 静态检查；合并后台首次手动运行与 tag 发布验证。

              Spec Patch：无。

              Design
              Doc：docs/openspec/changes/docker-image-support/design.md（确认后补
              frontmatter 并登记）。
            requirementsEvidence:
              contentHash: 820d2a8d97eff7be68617f73ca202e15b0465fb34074780a0773cdf93204d91c
