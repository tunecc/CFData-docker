            handoffHash: 3c3147653da3ae5d424de149a117ab13d01e1c3d8dbb3e33a31279e925277dd4
            proposal: |-
              技术方案：cliFileConfig 新增 R2AliasFormat（JSON 键 r2aliasformat），空值回落现有「数据中心-城市」默认别名，旧配置零迁移。模板引擎用 strings.NewReplacer 简单替换 7 个占位符 {dc} {city} {region} {dcCountry} {ip} {port} {ipport}，未识别占位符按字面保留，不用 text/template（无注入面）。应用点：formatSubstoreResults 参数化别名生成，R2 调度路径（writeCLIExportAndMaybeUpload）与手动路径（uploadManualRowsToR2）传入模板，本地导出弹窗传空维持现行为。替换清洗后别名为空时回落默认 substoreAlias，不产出空别名行。界面：自动化配置区新增别名模板输入框（占位符 hint），保存 R2 配置后显示最终上传地址（worker-url/filename）与旧对象不删除提示。校验：validateScheduleConfigUpdate 长度≤200、拒绝 # 字符。
              取舍与风险：R2 旧对象不自动删除（破坏性操作不做），UI 文案提示替代；region 等字段个别节点为空时空别名兜底回落；已核实官方与非标结果行均具备全部占位符字段。
              测试策略：表驱动单元测试覆盖模板渲染各分支；扩展 r2_test.go/r2_manual_test.go 断言两条上传路径按模板命名；scheduler_test.go 覆盖保存/校验/回显往返；手动验收配置模板后上传检查内容。
              Spec Patch：无，Open 阶段 delta spec 已完整覆盖。
              用户决定：确认本设计（2026-10-31，AskUserQuestion「确认本设计」）。
