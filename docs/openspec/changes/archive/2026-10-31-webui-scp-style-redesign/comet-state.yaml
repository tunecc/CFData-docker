              proposal: "技术方案：整体重写 index.html（零依赖单文件+go:embed+WebSocket 通道不变）：CSS 变量设计体系（teal
                #0ea5a0、语义色、玻璃拟态、color-mix、暗色 #121316）+ 三栏
                Grid（左导航：任务运行/官方优选/非标优选/分析报告/设置；中栏控制卡+日志卡；右栏配置卡）+ 移动端单列。48px
                圆形启停状态机（空闲绿/准备蓝/运行红/停止中）+乐观
                UI+toast；进度条阶段名+计数+shimmer。终端风日志：级别着色、上滚暂停+回到底部胶囊、500
                行环形缓冲（修复现有无上限）。分析：统计
                chips+DC/地区排行（前端聚合不加后端消息）+结果表排序筛选复制+导出上传入口。兼容：21 种 WS 请求/39
                种响应语义全兼容，Android 桥保留，login.html 统一主题，服务端最小改动。取舍与风险：重写回归风险以
                protocol.go 消息清单逐项迁移核对，git 历史可回滚；现代浏览器目标，关键容器
                fallback；不逐像素对照范本。测试策略：go build/test 全绿+测试版构建+本地真实运行走查 17
                个验收场景+Docker 最终验收。Spec Patch：无，web-console delta spec
                已完整覆盖。用户决定：设计内容与 Open 阶段已批准产物完全一致，Step 1c 确认提问未获答复，按 Open
                批准继续（自主会话）。"
