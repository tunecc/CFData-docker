        renderResultFieldOptions→saveResultPanelSettings（写 localStorage + 500ms
        防抖同步）；右上角保存 flush 后由 result_panel_config_saved 显示「结果操作配置已保存」。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：换浏览器，或改用另一个访问地址（如 `http://localhost:端口` 与
      `http://局域网IP:端口`）打开页面，仍恢复服务器上最后一次保存的结果面板设置。
    result: passed
    reason:
      text: server.go 提供 get/save_result_panel_config，写入与 cfdata-config.json 同目录的
        result-panel.json（容器 /data）；init_config 后前端请求并
        applyServerResultPanelSettings 以服务器值覆盖本地并回写缓存。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：服务器没有设置记录、但浏览器本地已有旧设置时，首次加载沿用本地设置并自动写入服务器（迁移），刷新与换浏览器后不再丢失。
    result: passed
    reason:
      text: readResultPanelSettings 对缺失、不可读与 JSON 损坏均返回 (nil,nil) 并打印日志；前端收到空设置时调用
        migrateLocalResultPanelSettings 上送本地旧设置，实现自愈；对应测试通过。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：服务器写入失败（如 `/data` 不可写）时界面给出可见提示，不显示保存成功；本地 localStorage 仍保留当前设置。
    result: passed
    reason:
      text: wsSend 失败时手动保存每次提示、自动同步首次提示并置标记、成功同步清零；服务器写入失败返回 saved:false+error
        并显示错误不显示成功；suppressScheduleSavedNotice 有 5 秒超时兜底。上一轮两处 MUST 偏差已修复。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：批量测速中单个 IP 返回 429 时，先等待 3 秒重试、仍 429 再等 6 秒重试；重试成功则正常记录速度并按阈值判定达标。
    result: passed
    reason:
      text: speedRateLimitBackoff={3s,6s}，最多重试 2 次，sleepCtx
        响应取消；重试成功进入正常记录与达标判定；三个退避测试均通过。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：重试后仍为 429 时自动切换到另一个可用测速源继续测速，日志说明「已切换测速源」。
    result: passed
    reason:
      text: 仍 429 时从 speedURLCandidates 选与当前不同、未尝试且非不可用的源并更新 currentURL；onSourceSwitch
        输出「测速源触发限流，已切换测速源：A → B」，不改用户配置。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：连续多个 IP（6 个）在换源后仍全部 429 时才停止批量测速，并提示已尝试更换测速源，达标统计与已测结果保持一致。
    result: passed
    reason:
      text: 阈值为连续 6 个 429，非 429 或成功即清零；终止日志在换源时追加「（已尝试更换测速源）」；结果按 IP
        合并，qualified/totalQualified 与 rateLimited 如实反映；两个核心测试通过。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：`go build ./...`、`go test ./...` 与前端 Node 测试通过；新增测试覆盖 429
      退避/换源/终止与设置文件读写。
    result: passed
