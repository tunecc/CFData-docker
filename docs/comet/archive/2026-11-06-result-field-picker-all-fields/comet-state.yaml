      text: renderResultFieldOptions 改为 buildResultFieldChoices(RESULT_FIELDS,
        resultCustomFields)，不再调用 getCurrentResultRows。以实际函数源码在 Node
        中执行、getCurrentResultRows 返回 [] 时渲染 27 个 checkbox（26 个内置 + 1 自定义），包含
        IP地址/端口号/网络延迟/数据中心/落地区域，自定义字段位于末尾。无结果行时通过「结果操作」标签进入：enhance.js
