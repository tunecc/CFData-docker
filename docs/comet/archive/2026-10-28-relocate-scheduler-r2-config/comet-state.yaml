":14},"relocate-scheduler-r2-config:15":{"results":{},"sequence":15},"relocate-scheduler-r2-config:16":{"results":{},"sequence":16},"relocate-scheduler-r2-config:17":{"results":{},"sequence":17},"relocate-scheduler-r2-config:3":{"results":{},"sequence":3},"relocate-scheduler-r2-config:5":{"results":{},"sequence":5},"relocate-scheduler-r2-config:6":{"results":{},"sequence":6},"relocate-scheduler-r2-config:7":{"results":{},"sequence":7},"relocate-scheduler-r2-config:9":{"results":{},"sequence":9}},"waits":[{"id":"relocate-scheduler-r2-config:2","stepId":"shape.confirm","sequence":2,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"relocate-scheduler-r2-config"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"以桌面宽度打开 Web 页面时，主页面直接显示独立「自动化」区块，自动调度与 R2 上传的全部 7 个字段（调度开关、Cron、检测间隔、R2 开关、Worker 地址、Worker token、文件名）及当前调度状态完整可见且可编辑，无需打开右上角设置菜单。"},{"id":"A2","source":"brief.md","text":"打开右上角设置菜单时，菜单中不再包含自动调度/R2 上传配置，主题切换、管理面代理与本地缓存功能仍正常可用。"},{"id":"A3","source":"brief.md","text":"在「自动化」区块修改输入但未保存时点击页面其他区域，已输入内容保持不变、不会丢失。"},{"id":"A4","source":"brief.md","text":"在设置菜单中修改管理面代理地址但未保存时点击页面其他区域，菜单保持打开；保存成功或再次点击设置按钮后才关闭。"},{"id":"A5","source":"brief.md","text":"修改调度字段并点击保存后，服务端保存成功，页面提示已保存并刷新调度状态（模式、下次/上次运行、上次结果）。"},{"id":"A6","source":"brief.md","text":"已保存过 Worker token 时，将 token 留空后保存会保留原有 token，输入框恢复「已保存，留空保持不变」提示。"},{"id":"A7","source":"brief.md","text":"以 ≤768px 宽度访问页面时，「自动化」表单纵向排列，无横向滚动或控件裁切，全部输入与按钮可正常操作。"},{"id":"A8","source":"specs/automation-settings-ui/spec.md","text":"主页面完整展示配置 - WHEN 用户以桌面宽度打开 Web 页面 - THEN 「自动化」区块直接可见，7 个字段与当前调度状态完整展示且可编辑，无需打开设置菜单 - 验收: A1"},{"id":"A9","source":"specs/automation-settings-ui/spec.md","text":"设置菜单职责收敛 - WHEN 用户打开右上角设置菜单 - THEN 菜单仅保留主题、管理面代理、本地缓存等设置，不再出现自动调度/R2 上传配置，其余设置仍可正常使用 - 验收: A2"},{"id":"A10","source":"specs/automation-settings-ui/spec.md","text":"主页面输入不因外部点击丢失 - WHEN 用户修改「自动化」区块的输入但未保存，随后点击页面其他区域 - THEN 已输入内容保持原样，不会因点击而消失 - 验收: A3"},{"id":"A11","source":"specs/automation-settings-ui/spec.md","text":"设置菜单未保存输入阻止关闭 - WHEN 用户修改设置菜单中的管理面代理地址但未保存，随后点击页面其他区域 - THEN 设置菜单保持打开；保存成功或再次点击设置按钮后才关闭 - 验收: A4"},{"id":"A12","source":"specs/automation-settings-ui/spec.md","text":"保存后刷新状态 - WHEN 用户修改调度字段并点击保存 - THEN 服务端保存成功并重载调度器，页面提示已保存，且刷新模式、下次/上次运行与上次结果 - 验收: A5"},{"id":"A13","source":"specs/automation-settings-ui/spec.md","text":"token 留空保留原值 - WHEN 已保存过 Worker token，用户将 token 输入留空后保存 - THEN 原有 token 保留，页面提示已保存，token 输入框恢复「已保存，留空保持不变」提示 - 验收: A6"},{"id":"A14","source":"specs/automation-settings-ui/spec.md","text":"移动端完整可操作 - WHEN 用户以 ≤768px 宽度访问页面 - THEN 「自动化」表单单列展示，无横向溢出，全部控件可正常操作 - 验收: A7"}],"children":null,"formalHash":"9b766f84417938d7dbe6b90f594d3422dc946ee48f571d68901eccc222371996","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"efe03c98bfc5c70cd70cb01bd3f38aa31ab9f673bec1e4e87514ceeb3429a7aa","contractHash":"c7b04a1888a4caeec003bb09339e6e18be0585124178107a396de67687304f71","inputHash":"8eec9bee9b3cf280456ab7c7f1b9d76ae4a6d89c9c8279bd9b1026ed7f7dbf1f","legacyFingerprint":"92cc0e3923a323363f5ae93478630109d2317c59f7495bbc6b66bb4af8e80cd2","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"ef58b802b84297dbc686088384b7ee2d817125f57e4363b7ad1356fffb26ab50","contractHash":"c66841f785fc7aabd31e57d893dfcdedd7ac3fe0e3963b8f43c04e6c5574cdda","inputHash":"0a772b08fb985069eb39271a26913e6d9f94b7e2ba2a80b724d92e6598ffc7ae","legacyFingerprint":"59a6d90d11f022b7ed8450b111f7ec0e942b3cba9caf33cca58809f7dbd620b7","source":"specs/automation-settings-ui/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"38907f9e1b9a7d2ee5b8e3574a4162c55d904102f61a41224dd101d5bf343e7d","specChanges":[{"capability":"automation-settings-ui","operation":"create","source":"specs/automation-settings-ui/spec.md"}]}}},"proposalHash":"513d66a0f05b80161e2e3a686a0f36877b885340c0c4afe9c