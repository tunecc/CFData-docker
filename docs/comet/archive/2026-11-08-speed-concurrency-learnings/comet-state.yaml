静默迁移为默认 0，现有键不受影响。"},{"id":"A6","source":"brief.md","text":"**A6 回归**：`combined_refactor` 下 `go build ./...`、`go vet ./...`、`go test ./...` 全部通过；web 侧 node:test 现有用例通过；编译测试版到 `release_assets/cfdata-test` 成功。"}],"children":null,"formalHash":"482ee43ce31cd3b5332b7cdd4d54b72d2f8035947b72119332b09e63503a6cf5","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"1b2525a92d5890c63fa30c531f5480132e4324b2528ef47517137c093c41fa45","contractHash":"0fecc2c5521fc8a7a7576c1117a2cb829f48fa8da5fc8d10c8e1e2f5ed684159","inputHash":"3c6b416dfa840046ed1110c08210f547f632038708c72288e854e0cf233af69a","legacyFingerprint":"7be351f7ea6f494b145ba9c5fe722fe4282cac9cec625fa4631d9b7f92b1d426","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"cdc0f4d07a63bf2e14887fad38c42eb8f5adba968ad9d2ef9c72400a7dc41b9a","contractHash":"efc334f83d774fec777e4116becf87af891ede3ba029d814856b62d7ca96da7a","inputHash":"b0623169aa008d235cf521c9c9389a2456189a4d5df8c3fff54df9d1a649a846","legacyFingerprint":"538a6245801c3f2e2a3fccbe47fe89a7a639eec07704a918f4b1b5fff2135c64","source":"specs/speed-concurrency-learnings/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"ca3cff7951f57241fbdd6085a55bd95e8562eaa416a94eb80a498fb26f7f051e","specChanges":[{"capability":"speed-concurrency-learnings","operation":"create","source":"specs/speed-concurrency-learnings/spec.md"}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"2caabea3291adaf4426df1e5532129044c2ba8ff78cc242be4c591607773d7cd","outcomeId":"581be36c-92a0-42bd-bb80-b754a9c7f881"}],"reconciliations":[],"ref":"native-shape-revalidate","requiredCapabilities":[],"retry":"manual","runId":"speed-concurrency-learnings","status":"succeeded","stepId":"shape.revalidate","type":"call_tool"},{"attempt":1,"claim":{"executorId":"native-host","sessionId":"zcode-speed-