组、间距保持、小数组（<2）、全部同 /24 的退化情况。"},{"id":"A2","source":"brief.md","text":"**A2 拥塞复核**：注入假探针返回拥塞 + 假 worker 第一次失败、第二次成功；断言该节点最终记为成功，且复核次数不超过预算 max(20, 总数/20)；预算耗尽后不再复核；抖动在 300–800ms 内（注入时钟）。"},{"id":"A3","source":"brief.md","text":"**A3 总限速**：配置 `speedbandwidth=10`（MB/s）时，多 worker 共同下载的聚合速率 ≤ 约 10MB/s + 桶容量余量（单测注入假下载源统计字节数/时间窗）；`speedbandwidth=0` 时行为与现状完全一致。"},{"id":"A4","source":"brief.md","text":"**A4 L/r 推导**：`speedbandwidth=10`、`speedMin=1`（MB/s）→ 测速并发 = min(模式并发, 10)；`speedMin=2.5` → min(模式并发, 4)；`speedbandwidth=0` → 并发 = 模式并发配置。单测直接验证推导函数。"},{"id":"A5","source":"brief.md","text":"**A5 配置页**：Web 配置页出现\"总测速带宽上限 (MB/s)\"输入项，0 或留空=关闭；保存持久化、重启读取生效；旧配置文件无此键时静默迁移为默认 0，现有键不受影响。"},{"id":"A6","source":"brief.md","text":"**A6 回归**：`combined_refactor` 下 `go build ./...`、`go vet ./...`、`go test ./...` 全部通过；web 侧 node:test 现有用例通过；编译测试版到 `release_assets/cfdata-test` 成功。"}],"children":null,"formalHash":"f85af3b06c3cc890eaffaaf4db4d1458b414514781be93499cd0c207d1ce1c02","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"72c8c8bc073304c4e0aa27a68346fe2eaa569aac897790fff612a05ddb39c96b","contractHash":"8354848cc67f851d19eecca285f126bb7a4f8712583c8850b5dbd887337524ec","inputHash":"775c2f17f661185150546ae72e279fb1391c7ddc96c1b9ff52ffb6c805d11f92","legacyFingerprint":"59e463da0d7a46d2d2eeb762394f618985f90a0bd6bd726b319d51083d4eacd5","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"7b5b3762bac864bd86e39630fb68ad1d33d2cbe0a79da622feb43ebbe01de562","contractHash":"a16734b6469e9e1b7aed9b5230d33dcd8a67845870388439c77c6dc92300152d","inputHash":"250146f84c6cac0bfc43f0747be4d8e3219f9e1ceaee85d0a1d7b8e244b37d6c","legacyFingerprint":"ceb6bab9ab7d51722afee975c71c6323c46e2fba4542a225a3b8679599eef5fe","source":"specs/speed-concurrency-learnings/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":