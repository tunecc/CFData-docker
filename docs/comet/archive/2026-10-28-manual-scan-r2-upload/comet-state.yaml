acceptance:
  - id: A1
    source: brief.md
    text: A1：启用 R2 上传且 Worker 地址、token 已配置时，Web 手动官方扫描完成详细测试后，系统自动把当前结果的 Sub-Store
      目标列表上传到配置的 R2 文件名，并记录成功日志。
    result: passed
    reason:
      text: 独立核对 runDetailedTest 在 test_complete 后调用
        triggerManualR2Upload（tasks_official.go:550）；Web 会话 session.emit==nil
        时读取当前 R2 配置，用 formatSubstoreResults 生成 Sub-Store 列表并由 uploadR2Content
        上传，成功写日志（r2_manual.go:54）。TestRunDetailedTestTriggersManualR2Upload 与
        TestManualR2UploadSuccessLogs 独立复跑通过。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：官方批量测速完成后，R2 同名文件更新为包含测速结果的目标列表；上传失败不影响测速结果展示。
    result: passed
    reason:
      text: runOfficialSpeedBatch 在 official_speed_complete 且未取消时先合并测速值，再以
        session.testResults 快照构造 officialResultRows
        并触发上传（tasks_speed.go:299-302），内容为含测速值的 Sub-Store
        目标列表；失败日志在异步上传中，不影响已发送的测速结果事件。TestOfficialResultRowsSubstoreContent 与
        TestManualR2UploadFailureKeepsOldContent 通过；外部网络端到端未跑，已核对源码路径。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：非标扫描结果生成后，以及非标批量测速完成后，系统按同一规则自动上传当前结果。
    result: passed
    reason:
      text: runNSBTask 在 nsb_csv_complete 后上传
        nsbPayloadRows（tasks_nsb.go:904），runNSBReallinkTask
        同样处理（:1114），runNSBSpeedBatch 在 nsb_speed_complete 后用 nsbSpeedResultRows
        合并测速值并上传（:1182）。TestRunNSBTaskTriggersManualR2Upload
        端到端验证扫描路径，TestNSBSpeedResultRowsMergesUpdatedSpeed
        验证测速合并与内容；非标批量测速外部网络端到端未跑，已核对源码路径。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：未启用 R2 上传时，手动任务不发起任何 R2 请求，任务行为与现状一致。
    result: passed
    reason:
      text: uploadManualRowsToR2 先读取配置，r2enabled=false
        时直接返回（r2_manual.go:37-39），全程不发起网络请求；TestManualR2UploadDisabledSkips
        验证请求数为 0 且无上传日志，任务完成事件在触发前已发送。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：已启用 R2 但 Worker 地址或 token 缺失时，系统跳过上传并给出明确提示，不阻塞任务完成。
    result: passed
    reason:
      text: r2enabled=true 但 Worker 地址或 token 为空时记录“R2 上传已启用，但 Worker 地址或 token
        未配置，已跳过手动结果上传”并返回（r2_manual.go:42-44）；TestManualR2UploadMissingConfigSkips
        覆盖缺地址、缺 token 与配置文件缺失，均为异步日志，不阻塞任务完成。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：R2 上传在重试后仍失败时，系统给出失败提示并保留 R2 旧文件，不改变扫描/测试结果状态。
    result: passed
    reason:
      text: 上传复用 uploadR2Content 的 3 次重试与 30s 超时；重试仍失败时 uploadManualRowsToR2 记录“R2
        上传失败，保留 R2 上的旧内容”（r2_manual.go:51），失败发生在 safeGo
        异步路径，不改变扫描/测试结果。TestManualR2UploadFailureKeepsOldContent 验证 502 重试 3
        次，TestManualR2UploadErrorRedactsToken 验证 token 不外泄。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：自动调度扫描的 R2 上传行为、内容与触发时机保持不变，且手动触发不会与调度路径重复上传。
    result: passed
    reason:
      text: git diff 显示 scheduler.go、cli.go、r2.go 与既有调度上传路径未改动；triggerManualR2Upload 在
        session.emit != nil 时直接返回（r2_manual.go:17），调度/CLI 会话仍只由
        writeCLIExportAndMaybeUpload 上传。TestTriggerManualR2UploadSkipsCLISession
        验证 CLI 会话零请求，既有调度 R2 测试在 Runtime go test ./... 与源码核对中保持通过。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：页面「自动上传」下拉框仍只列出 GitHub 账户；R2 自动上传由「启用 R2 上传」开关控制，页面文案明确说明两者关系。
    result: passed
    reason:
      text: index.html 仅在 R2 列新增 .automation-hint 文案，明确自动调度与手动任务都会上传、结果页“⬆ 自动上传”下拉框仅用于
        GitHub 账户且在导出弹窗配置、两者互不影响；renderGitHubAccounts 仍只从 localStorage 的 GitHub
        账户生成两个自动上传下拉框（index.html:5540-5542）。TestAutomationSectionExplainsGitHubAndR2Upload
        通过。
      truncated: false
