      text: 链路完整：index.html 测试按钮 → wsSend test_management_proxy → server.go handler →
        testManagementProxyConnectivity → proxy_test_result → app.js
        applyProxyTestResult/formatProxyTestResult → 结果行。后端 live 实证（真实网络）：直连分支返回
        ok=true、exitIP=216.236.6.230、country=HK、latencyMs=1267；可用代理与直连共用同一请求与解析代码路径。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 测试失败（代理不可达、超时、认证失败）时，显示测试失败与具体原因，且不改变已保存的代理配置与全局生效代理。"
    result: passed
    reason:
      text: live 实测：无效地址（127.0.0.1:1080）返回 error=代理地址缺少协议头；socks5://127.0.0.1:1 不可达返回
        error=connection refused；两者 ok=false 且实现中无
        updateProxyInConfigFile/setManagementProxy 调用，已保存配置与全局状态不受影响。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 输入框已填写但尚未保存的代理地址时，「测试」针对输入框当前值进行（不落盘、不改变全局生效代理）；输入框为空时针对当前生效出口测试（程序配置
      → 系统环境变量 → 直连）。"
    result: passed
    reason:
      text: resolveProxyTestTarget：raw 非空走 parseManagementProxy 显式分支（不读不写全局
        managementProxyURL/配置文件）；raw 为空按程序配置→环境变量→直连生效链（Go 单测
        TestResolveProxyTestTargetEmptyPrefersProgramConfig 验证程序配置优先）。前端
        testManagementProxy 发送输入框当前值，为空时发送空 value。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 未配置程序代理、但存在系统环境变量代理时，测试经环境变量代理进行，结果标注来源为「系统环境变量」。"
    result: passed
    reason:
      text: Go 单测 TestResolveProxyTestTargetEmptyFallsBack：设置 HTTPS_PROXY 后空值解析
        source=系统环境变量、目标 http://10.0.0.1:7890。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 无任何代理配置时，测试走直连，结果标注为直连出口。"
    result: passed
    reason:
      text: Go 单测 TestResolveProxyTestTargetEmptyNoProxyDirect + live 实测：无任何代理时
        source=直连、proxyLabel 为空、请求真实成功。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 测试请求与结果不泄露代理认证信息：UI、日志与错误信息中只出现 `scheme://host` 形式（复用
      `maskProxyURL`），不含用户名/密码。"
    result: passed
    reason:
      text: Go 单测 TestProxyTestResultMasked 验证 maskProxyURL 不含 alice/secret；live 实测
