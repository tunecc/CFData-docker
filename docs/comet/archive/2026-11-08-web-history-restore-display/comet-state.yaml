        hasTask:false。TestTaskSnapshotMissingOrCorruptFallsBack 三种损坏情况带 -race
        通过。
      truncated: false
  - id: A5
    source: brief.md
    text: A5 占位符清除：任何日志或恢复内容到达后，logBox 中不再残留静态「[系统] 等待操作...」行。
