    source: brief.md
    text: A4 无快照回退：`task-state.json` 缺失或损坏时打开网页不报错，行为与现状一致（历史摘要恢复可用）。
    result: passed
    reason:
      text: loadTaskDiskSnapshot 对缺失/解析失败/未知 schema 三种情况返回错误，buildTaskRestoreFromDisk
        ok=false 回退现状（taskstate.go:131-135），sendTaskRestore 继续下发空 task_restored
        与历史摘要，前端 applyTaskRestoredState 对 !hasTask 提前返回不崩溃。真实进程 E2E
        独立复现损坏回退：种子文件 speed 字段形状错误（对象而非数组）导致 Unmarshal 失败，服务返回 hasTask:false 且无
