        json:"fromDisk,omitempty"，内存路径载荷线格式与原实现逐字节一致；sendTaskRestore
        下发序列（task_restored→task_restore_chunk→task_restore_done{lastSeq}→sendLatestHistoryToSession）未变（server.go:120-129）。真实进程
        E2E：任务结束后不重启直接重连，返回 hasTask:true 且 fromDisk
        字段缺失（null），无重复行。TestResolveTaskRestorePriority 断言内存可用时 FromDisk=false。
      truncated: false
