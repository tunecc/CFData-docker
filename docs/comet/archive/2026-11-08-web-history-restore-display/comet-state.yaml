    text: A1 重启后恢复完整视图：任务完成后重启进程（内存回放清空、无任务运行），打开网页 →
      运行日志呈现上次任务的日志内容（而非仅一行恢复提示），结果表格数据与上次任务结束时的内存回放一致（scan/test/speed/nsb
      各按现有上限截断），进度区显示「完成」终态。
    result: passed
    reason:
      text: 独立 E2E（自建 /tmp 二进制+裸 WS 客户端，非 Builder 脚本）：进程重启后（内存回放为空）新连接收到
        task_restored{hasTask:true, fromDisk:true, running:false, label,
        snapshot.phase:完成}，logs 3 行完整下发，结果行经 appendTaskRestoreChunks 分片（scan 2
        行+speed 1 行）与内存路径完全同构（taskstate.go:146-154 与 session.go:462-470
        逐分支一致）；TestTaskSnapshotPersistAndRestoreRoundtrip 与
        TestResolveTaskRestorePriority（taskSession 换 newHubSession 模拟重启）带 -race
        通过；进度区终态由前端 updateProgress(snapshot.phase='完成') 承担（app.js:1687），未改动。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 快照落盘内容与生命周期：任务结束后 `<historyDir>/task-state.json`
      存在，包含运行日志与各类结果行（含被用户停止的任务）；下一次任务开始（beginTask）不删除该文件；新任务结束后文件内容被覆盖为新任务。
    result: passed
    reason:
      text: "真实进程 E2E：真实测速任务结束后 task-state.json 由生产代码写入（label/phase/logs/speed
        均在）；第二任务 beginTask 清内存后文件保留第一任务内容（运行中实测读取确认）；第二任务结束后 mtime
        14:04→14:05、668→671 字节确认覆盖；被用户停止的任务 stop_task 后文件覆盖为
        phase=已停止（markTaskFinished(true) 终态）；失败任务（测速失败: 连接错误）同样落盘。调用点位于
        markTaskFinished 之后、endTask 之前（session.go:184-191），isTaskRunning 仍为 true
        使 beginTask 返回 false，回放缓冲不可能被并发清空；captureTaskDiskSnapshot 锁序 taskMutex
        释放后再取 replayMutex（taskstate.go:44-52），与 beginTask 的
        taskMutex→replayMutex 无倒置。TestTaskSnapshotSurvivesBeginTaskAndOverwrite
        带 -race 通过。"
      truncated: false
  - id: A3
    source: brief.md
    text: A3 运行中不恢复快照：有任务运行时新连接不读取、不下发磁盘快照内容，恢复路径与现状一致（内存回放优先）。
    result: passed
    reason:
      text: resolveTaskRestore 分支严格为 !payload.HasTask &&
        !anyTaskRunning()（taskstate.go:163），磁盘读取只在该分支内。真实进程 E2E：向不可路由 IP
        发起挂起测速任务期间新连接 peek 返回 {hasTask:true, running:true, phase:准备中, fromDisk
        缺失}，纯内存状态、无任何磁盘快照内容；TestResolveTaskRestorePriority 用阻塞任务确定性断言
        FromDisk=false。
      truncated: false
