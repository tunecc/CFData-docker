<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6f7">
    <title>CFData 登录</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --bg: #f4f6f7;
            --fg: #1a1d21;
            --card: #ffffff;
            --muted: #646971;
            --border: rgba(15, 23, 42, 0.08);
            --accent: #0ea5a0;
            --accent-2: #09c7c1;
            --accent-soft: rgba(14, 165, 160, 0.1);
            --danger: #ed1717;
        }

        :root[data-theme='dark'] {
            --bg: #121316;
            --fg: #e6e6e6;
            --card: #18191b;
            --muted: #9aa4b2;
            --border: rgba(255, 255, 255, 0.07);
            --accent-soft: rgba(14, 165, 160, 0.16);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--fg);
            background: var(--bg);
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 0 0 1px var(--border), 0 16px 40px rgba(15, 23, 42, 0.1);
            padding: 26px 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 17px;
            box-shadow: 0 4px 12px rgba(14, 165, 160, 0.35);
        }

        h1 { margin: 0; font-size: 19px; }

        .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

        .error {
            display: none;
            margin-bottom: 12px;
            background: color-mix(in srgb, var(--danger) 7%, transparent);
            color: var(--danger);
            border-radius: 10px;
            border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
            padding: 10px 12px;
            font-size: 13px;
        }

        .field { margin-bottom: 12px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        input {
            width: 100%;
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--fg) 3%, var(--card));
            color: var(--fg);
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        button {
            width: 100%;
            height: 42px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 4px 14px rgba(14, 165, 160, 0.3);
            transition: filter 0.15s ease, transform 0.15s ease;
        }

        button:hover { filter: brightness(1.05); transform: translateY(-1px); }

        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 11px;
            color: var(--muted);
        }
    </style>
    <script>
        (function () {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var stored = null;
            try { stored = localStorage.getItem('cfdata-theme'); } catch (e) {}
            var dark = stored === 'dark' || ((stored === null || stored === 'auto') && prefersDark);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
</head>
<body>
    <form class="card" method="post" action="/auth/login" autocomplete="off">
        <div class="brand">
            <div class="brand-mark">CF</div>
            <div>
                <h1>CFData 控制台</h1>
            </div>
        </div>
        <p class="sub">请输入管理员账号和密码</p>
        <div class="error" id="errorBox">用户名或密码错误，请重试。</div>
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" required>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" required>
        </div>
        <button type="submit">登录</button>
        <div class="footer">Cloudflare IP 优选 · 数据中心库</div>
    </form>

    <script>
        const p = new URLSearchParams(window.location.search);
        if (p.get('error') === '1') {
            const box = document.getElementById('errorBox');
            box.style.display = 'block';
        }
    </script>
</body>
</html>
