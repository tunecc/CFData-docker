name: Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GHCR image
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/cfdata-web" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: build-meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="edge-${COMMIT_SHA:0:7}"
          else
            version="$REF_NAME"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') == false) }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=CFData-WEB
            org.opencontainers.image.description=Cloudflare IP 测试与筛选工具（Web 模式）
            org.opencontainers.image.version=${{ steps.build-meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.build-meta.outputs.revision }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-meta.outputs.version }}
            REVISION=${{ steps.build-meta.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.build-meta.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Docker 镜像构建：$JOB_STATUS"
            echo
            echo "- 镜像：\`$IMAGE\`"
            echo "- 标签：\`$(printf '%s' "$TAGS" | tr '\n' ' ' | sed 's/ *$//')\`"
            echo "- 版本：\`$VERSION\`"
            echo "- 提交：\`$COMMIT_SHA\`"
            if [ -n "$DIGEST" ]; then
              echo "- Digest：\`$DIGEST\`"
            else
              echo "- Digest：无（构建或推送未完成）"
            fi
            if [ "$JOB_STATUS" != "success" ]; then
              echo
              echo "> 失败阶段：查看失败步骤的日志（Checkout、Compute、QEMU/Buildx 初始化、GHCR 登录、元数据解析、Build and push）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
